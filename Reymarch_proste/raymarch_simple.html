<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raymarching Simple</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const vertexShader = `
void main() {
  gl_Position = vec4(position, 1.0);
}
`;

const fragmentShader = `
uniform vec2 u_resolution;
uniform float u_time;

#define MAX_STEPS 100
#define MAX_DIST  100.0
#define SURF_DIST 0.001

float sdSphere(vec3 p, float r) {
  return length(p) - r;
}

float sdBox(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
}

float sdTriPrism(vec3 p, vec2 h) {
  vec3 q = abs(p);
  return max(q.z - h.y, max(q.x * 0.866025 + p.y * 0.5, -p.y) - h.x * 0.5);
}

float sdTorus(vec3 p, vec2 t) {
  vec2 q = vec2(length(p.xz) - t.x, p.y);
  return length(q) - t.y;
}

vec2 scene(vec3 p) {
  float sphere = sdSphere(p - vec3(-4.5, 0.0, 0.0), 0.75);
  float box    = sdBox(p - vec3(-1.5, 0.0, 0.0), vec3(0.6));
  float prism  = sdTriPrism(p - vec3(1.5, -0.2, 0.0), vec2(1.2, 0.6));
  float torus  = sdTorus(p - vec3(4.5, 0.0, 0.0), vec2(0.65, 0.22));

  float d = sphere;
  float id = 0.0;

  if (box < d)   { d = box;   id = 1.0; }
  if (prism < d) { d = prism; id = 2.0; }
  if (torus < d) { d = torus; id = 3.0; }

  return vec2(d, id);
}

vec3 calcNormal(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(
    scene(p + e.xyy).x - scene(p - e.xyy).x,
    scene(p + e.yxy).x - scene(p - e.yxy).x,
    scene(p + e.yyx).x - scene(p - e.yyx).x
  ));
}

vec2 rayMarch(vec3 ro, vec3 rd) {
  float d = 0.0;
  float id = -1.0;
  for (int i = 0; i < MAX_STEPS; i++) {
    vec3 p = ro + rd * d;
    vec2 hit = scene(p);
    if (hit.x < SURF_DIST) { id = hit.y; break; }
    if (d > MAX_DIST) break;
    d += hit.x;
  }
  return vec2(d, id);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;

  vec3 ro = vec3(0.0, 0.5, 8.0);
  vec3 rd = normalize(vec3(uv, -1.5));

  vec2 hit = rayMarch(ro, rd);
  float d = hit.x;
  float id = hit.y;

  vec3 col = vec3(0.05, 0.05, 0.1);

  if (d < MAX_DIST) {
    vec3 p = ro + rd * d;
    vec3 n = calcNormal(p);

    vec3 lightPos = vec3(2.0, 5.0, 5.0);
    vec3 lightDir = normalize(lightPos - p);
    vec3 viewDir  = normalize(ro - p);
    vec3 halfDir  = normalize(lightDir + viewDir);

    float diff = max(dot(n, lightDir), 0.0);
    float spec = pow(max(dot(n, halfDir), 0.0), 48.0);
    float amb  = 0.08;

    vec3 baseCol;
    if      (id < 0.5) baseCol = vec3(0.2, 0.5, 1.0);
    else if (id < 1.5) baseCol = vec3(1.0, 0.4, 0.2);
    else if (id < 2.5) baseCol = vec3(0.3, 0.9, 0.4);
    else               baseCol = vec3(0.9, 0.2, 0.7);

    col = baseCol * (amb + diff * 0.9) + vec3(1.0) * spec * 0.6;
  }

  col = pow(col, vec3(0.4545));
  gl_FragColor = vec4(col, 1.0);
}
`;

const geometry = new THREE.PlaneGeometry(2, 2);
const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: {
    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    u_time: { value: 0.0 }
  }
});

scene.add(new THREE.Mesh(geometry, material));

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  material.uniforms.u_time.value = clock.getElapsedTime();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
